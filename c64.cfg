MEMORY {
    ZP:       file = "", start = $0002, size = $00fe;
    LOADADDR: file = %O, start = $07ff, size = 2;
    MAIN:     file = %O, start = $0801, size = $97ff;
    BSS:      file = "", start = $0200, size = $0600;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    STUB:     load = MAIN,     type = ro, start = $0801;
    CODE:     load = MAIN,     type = ro, start = $0810;
    RODATA:   load = MAIN,     type = ro;
    SOUNDC:   load = MAIN,     type = ro;
    SPRITES:  load = MAIN,     type = ro;
    BSS:      load = BSS,      type = bss;
}
