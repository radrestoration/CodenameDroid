# ld65 layout for the engine prototype (proto/proto.s): one PRG from $0801; the data sits where it is used
MEMORY {
    ZP:       file = "", start = $0002, size = $00fe;
    LOADADDR: file = %O, start = $07ff, size = 2;
    MAIN:     file = %O, start = $0801, size = $b7ff, fill = yes;
    BSS:      file = "", start = $0400, size = $0400;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    STUB:     load = MAIN,     type = ro, start = $0801;
    CODE:     load = MAIN,     type = ro, start = $0810;
    RODATA:   load = MAIN,     type = ro;
    ROWS:     load = MAIN,     type = ro, start = $2800;      # the level: 32 rows of 256 cells ($2800-$47ff)
    BPAT:     load = MAIN,     type = ro, start = $4800;      # the BBC bytes of each character, a page a line
    CHARSET:  load = MAIN,     type = ro, start = $a000;      # (VIC-II bank 2)
    MATRICES: load = MAIN,     type = ro, start = $a800;      # the two screen matrices and their sprite pointers ($a800, $ac00)
    SPRITES:  load = MAIN,     type = ro, start = $b000;      # sprite blocks
    BSS:      load = BSS,      type = bss;
}
