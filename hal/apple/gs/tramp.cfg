# 512 bytes for bank 2 $0600-$07FF: the page below the trampolines (zero) and the trampolines at $0700.
MEMORY { PAD: file = "%O", start = $0600, size = $0100, fill = yes, fillval = $00;
         T:   file = "%O", start = $0700, size = $0100, fill = yes, fillval = $00; }
SEGMENTS { CODE: load = T, type = ro; }
