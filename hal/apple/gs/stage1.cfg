# Stage 1: read at $0A00 by stage 0 (up to 4 KB; its direct-page variables are scratch, the demo starts afterwards).
MEMORY {
    ZP: file = "", start = $0000, size = $0100;
    S1: file = "%O", start = $0a00, size = $0fe0;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = S1, type = ro;
}
