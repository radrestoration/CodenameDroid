# Test link: the code and variables at fixed places; the data (loaded by the test) in banks 2 and 3.
MEMORY {
    ZP:   file = "", start = $0000, size = $0100;
    CODE: file = "%O", start = $1000, size = $1000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = CODE, type = ro;
}
SYMBOLS {
    cells:  type = export, value = $020000;
    tiles:  type = export, value = $030000;
    levels: type = export, value = $030a00;
}
