# The demo and the tile drawing routines, loaded by stage 1 at $2000; the data they use is loaded to banks 2 and 3.
MEMORY {
    ZP:   file = "", start = $0000, size = $0100;
    CODE: file = "%O", start = $2000, size = $1800;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = CODE, type = ro;
}
SYMBOLS {
    cells:  type = export, value = $020000;
    tiles:  type = export, value = $030000;
    levels: type = export, value = $030a00;
}
