# Test link: the layer's code in bank 2, its tables after it; the test loads bbc2shr.bin (1 KB) and has 8 KB for shrchars.
MEMORY {
    ZP:  file = "", start = $0000, size = $0100;     # offsets in the layer's direct page (placed at $0700 by shr.s)
    HAL: file = "%O", start = $020000, size = $1800;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = HAL, type = ro;
    SLAM:     load = HAL, type = ro;      # (bank 2: not affected by RAMRD)
}
SYMBOLS {
    bbc2shr:  type = export, value = $021800;
    shrchars: type = export, value = $022000;
    shadow:   type = export, value = $024000;     # 2 KB: BPAT as last seen
    dirty:    type = export, value = $024800;     # 256 flags
    shadowmat: type = export, value = $024a00;    # 1000 bytes: the matrix as drawn
    cellscr:  type = export, value = $025000;     # 2000 bytes: the screen offset of each cell
    splist:   type = export, value = $026000;     # 512 bytes: the cells the sprites covered
    spstate:  type = export, value = $026400;
    splatch:  type = export, value = $026440;
    chdirty:  type = export, value = $026470;
    edgebuf:  type = export, value = $025800;
    slam_save: type = export, value = $026480;
    ulist:    type = export, value = $027000;
    cellmark: type = export, value = $027800;
    incell:   type = export, value = $027c00;
    shrbuf:   type = export, value = $028000;     # 32 bytes: the sprite registers as drawn
}
