# The platform layer and the display layer: loaded by stage 1 at $2000 of bank 0; the display layer's tables in bank 3.
MEMORY {
    ZP:   file = "", start = $0000, size = $0100;     # offsets within the display layer's direct page (shr.s puts it at $0700)
    PBSS: file = "", start = $0300, size = $0020;      # the platform's variables
    CODE: file = "%O", start = $2000, size = $5000;
    SLAMM: file = "build/apple2gs/slam.bin", start = $03e400, size = $1000;   # bank 3: RAMRD / RAMWRT make bank 0 reads and writes go to bank 1
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    PBSS:     load = PBSS, type = bss;
    ENTRY:    load = CODE, type = ro;
    CODE:     load = CODE, type = ro;
    SLAM:     load = SLAMM, type = ro;
}
SYMBOLS {
    bbc2shr:  type = export, value = $030000;
    shrchars: type = export, value = $031000;
    shadow:   type = export, value = $033000;
    dirty:    type = export, value = $033800;
    shadowmat: type = export, value = $033a00;
    cellscr:  type = export, value = $033e00;
    splist:   type = export, value = $034800;
    spstate:  type = export, value = $034a00;
    ulist:    type = export, value = $035000;       # 2000 bytes: the cells to compose this call
    cellmark: type = export, value = $035800;       # 1000 bytes: stamp per cell
    incell:   type = export, value = $035c00;       # 1000 bytes: 1 where a sprite is
    shrbuf:   type = export, value = $036000;       # 32000 bytes: the compose canvas, screen layout
    splatch:  type = export, value = $034c00;
    chdirty:  type = export, value = $034c20;
    edgebuf:  type = export, value = $03e000;       # 800 bytes: the new column's 25 cells
    slam_save: type = export, value = $034c30;      # 4 bytes: S and D while the stack is on the screen
}
