# The game logic for the IIgs: loaded at $0801 of bank 2 (the C64's layout). The ZEROPAGE and BSS segments take no space in the file.
MEMORY {
    ZP:   file = "", start = $0002, size = $00fe;
    MAIN: file = %O, start = $0801, size = $97ff;
    BSS:  file = "", start = $0200, size = $0600;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = ro, start = $0801;
    RODATA:   load = MAIN, type = ro;
    SPRITES:  load = MAIN, type = ro;
    BSS:      load = BSS,  type = bss;
}
