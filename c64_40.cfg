# ld65 layout for the C64 build with the 40-column ring (WIDE=40). One PRG from $0801 to the end of the engine. The BBC
# game sits at its own addresses ($1100 game) and its tile graphics, which the 10 KB ring ($5800-$7fff) displaces, at
# $8000; its other data blocks are carried at $5800+ (in the ring's area, which start-up empties) and moved to their
# BBC addresses by start (platform.s), which is at $8800 (SYS 34816).
MEMORY {
    PRGHDR:  file = %O, start = $07ff, size = 2;
    PRG:     file = %O, start = $0801, size = $8a00, fill = no;     # (the Makefile makes it larger)

    RUN0400: file = "", start = $0400, size = $0d00;
    RUN03A0: file = "", start = $03a0, size = $0040;
    RUN0180: file = "", start = $0180, size = $0040;
    RUN0380: file = "", start = $0380, size = $0020;
    RUNSND:  file = "", start = $ee00, size = $0400;
    RUNTBL:  file = "", start = $f200, size = $0600;
    RUN0300: file = "", start = $0300, size = $0060;
}
SEGMENTS {
    LOADADDR: load = PRGHDR, type = ro;
    STUB:     load = PRG, type = ro;
    DROID:    load = PRG, start = $1100, type = rw, define = yes;
    D2_0400:  load = PRG, run = RUN0400, type = rw, define = yes;
    D2_03A0:  load = PRG, run = RUN03A0, type = rw, define = yes;
    D2_0180:  load = PRG, run = RUN0180, type = rw, define = yes;
    D2_0380:  load = PRG, run = RUN0380, type = rw, define = yes;
    D2_0300:  load = PRG, run = RUN0300, type = rw, define = yes;
    INTRO2:   load = PRG, start = $6600, type = ro;                  # the second loading picture: in the gap the staged blocks leave below the tiles
    D2_5800:  load = PRG, start = $8000, type = rw;
    START:    load = PRG, start = $8800, type = ro;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    SOUNDC:   load = PRG, run = RUNSND, type = ro, define = yes;   # the sound driver and its tables, copied to $ee00 by start (the PRG would not fit below $a000 otherwise)
    TBLBSS:   load = RUNTBL, type = bss, define = yes;               # (the tables made at start-up: star, pixel conversion, hash, chandelier; see make_runtime_tables)
    INTRO:    load = PRG, type = ro;   # the loading screens' data (src/intro.s), after everything else and below the screen RAM it uses ($d000)
}
