# ld65 layout for the loading screens program: one PRG from $0801 (the pictures and text are unpacked into bank 3 and bank 1)
MEMORY {
    LOADADDR: file = %O, start = $07ff, size = 2;
    MAIN:     file = %O, start = $0801, size = $5400;
    ZP:       file = "", start = $0002, size = $00fe;
    BSS:      file = "", start = $0200, size = $0600;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STUB:     load = MAIN, type = ro, start = $0801;
    CODE:     load = MAIN, type = ro, start = $0810;
    INTRO:    load = MAIN, type = ro;
    INTRO2:   load = MAIN, type = ro;
}
