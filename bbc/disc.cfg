# ld65 layout for the disc release: one file, CDroid4 (load &1100, exec &6e00).
#
#   &1100-&57ff  the game
#   &5800-&5fff  tile data, in place
#   &6000-&6cff  staging for &0400-&10ff, moved there by disc_entry.s
#   &6d00-&6dff  staging for the small blocks at &03a0, &0180, &0380, &0300
#   &6e00-&6eff  disc_entry.s (exec)
MEMORY {
    CDROID4: file = "../build/bbc/CDroid4", start = $1100, size = $5e00;

    RUN0400: file = "", start = $0400, size = $0d00;
    RUN03A0: file = "", start = $03a0, size = $0040;
    RUN0180: file = "", start = $0180, size = $0040;
    RUN0380: file = "", start = $0380, size = $0020;
    RUN0300: file = "", start = $0300, size = $0060;
}
SEGMENTS {
    DROID:      load = CDROID4, type = rw;
    D2_5800:    load = CDROID4, type = rw;
    D2_0400:    load = CDROID4, run = RUN0400, type = rw, define = yes;
    D2_03A0:    load = CDROID4, run = RUN03A0, type = rw, define = yes;
    D2_0180:    load = CDROID4, run = RUN0180, type = rw, define = yes;
    D2_0380:    load = CDROID4, run = RUN0380, type = rw, define = yes;
    D2_0300:    load = CDROID4, run = RUN0300, type = rw, define = yes;
    DISC_ENTRY: load = CDROID4, type = rw;
}
