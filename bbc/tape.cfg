# ld65 layout for the TAPE release (make tape): the two files as the game loads them.
#
# DROID  - loads at &1100 and is exec'd at &5800 (the loader at the end of
#          the file: it wipes &5900-&7fff and does *RUN Droid2).
# DROID2 - loads at &6500 and is exec'd at &7b00. The entry code there
#          moves the data blocks to where the game uses them (see the
#          comments at the start of D2_5800 etc. in src/droid2.s), so
#          each block is stored in the file but "run" at its final home.
MEMORY {
    DROID:   file = "../build/bbc/DROID",  start = $1100, size = $4800;
    DROID2:  file = "../build/bbc/DROID2", start = $6500, size = $1700;

    RUN5800: file = "", start = $5800, size = $0800;
    RUN03A0: file = "", start = $03a0, size = $0040;
    RUN0180: file = "", start = $0180, size = $0040;
    RUN0380: file = "", start = $0380, size = $0020;
    RUN0300: file = "", start = $0300, size = $0060;
    RUN0400: file = "", start = $0400, size = $0d00;
}
SEGMENTS {
    DROID:   load = DROID,  type = rw;
    LOADER:  load = DROID,  type = rw;

    D2_5800: load = DROID2, run = RUN5800, type = rw;
    D2_03A0: load = DROID2, run = RUN03A0, type = rw;
    D2_0180: load = DROID2, run = RUN0180, type = rw;
    D2_0380: load = DROID2, run = RUN0380, type = rw;
    D2_0300: load = DROID2, run = RUN0300, type = rw;
    D2_0400: load = DROID2, run = RUN0400, type = rw;
    D2_7B00: load = DROID2, type = rw;
}
